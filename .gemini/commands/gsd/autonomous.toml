description = "Run all remaining phases autonomously — discuss→plan→execute per phase"
prompt = "<objective>\nExecute all remaining milestone phases autonomously. For each phase: discuss → plan → execute. Pauses only for user decisions (grey area acceptance, blockers, validation requests).\n\nUses ROADMAP.md phase discovery and Skill() flat invocations for each phase command. After all phases complete: milestone audit → complete → cleanup.\n\n**Creates/Updates:**\n- `.planning/STATE.md` — updated after each phase\n- `.planning/ROADMAP.md` — progress updated after each phase\n- Phase artifacts — CONTEXT.md, PLANs, SUMMARYs per phase\n\n**After:** Milestone is complete and cleaned up.\n</objective>\n\n<execution_context>\n@D:/Documentsss/lyrics-teleprompter/.gemini/get-shit-done/workflows/autonomous.md\n@D:/Documentsss/lyrics-teleprompter/.gemini/get-shit-done/references/ui-brand.md\n</execution_context>\n\n<context>\nOptional flags:\n- `--from N` — start from phase N instead of the first incomplete phase.\n- `--to N` — stop after phase N completes (halt instead of advancing to next phase).\n- `--only N` — execute only phase N (single-phase mode).\n- `--interactive` — run discuss inline with questions (not auto-answered), then dispatch plan→execute as background agents. Keeps the main context lean while preserving user input on decisions.\n\nProject context, phase list, and state are resolved inside the workflow using init commands (`gsd-sdk query init.milestone-op`, `gsd-sdk query roadmap.analyze`). No upfront context loading needed.\n</context>\n\n<process>\nExecute the autonomous workflow from @D:/Documentsss/lyrics-teleprompter/.gemini/get-shit-done/workflows/autonomous.md end-to-end.\nPreserve all workflow gates (phase discovery, per-phase execution, blocker handling, progress display).\n</process>"
